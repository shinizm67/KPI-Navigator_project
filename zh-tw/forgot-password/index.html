<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重設密碼 | Key Performance Navigator | FORGE LABORATORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDP+Gothic:wght@400;500;700&family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../register/style.css">
  <link rel="stylesheet" href="../../en/login/style.css">
  <style id="kpi-lang-switcher-locale">
    html[lang='ja'] .lang-option-zh-tw { display: none !important; }
    html[lang='zh-TW'] .lang-option-ja,
    html[lang^='zh'] .lang-option-ja { display: none !important; }
  </style>
</head>
<body class="si-fi login-page" id="body-el">
  <header class="site-header">
    <div class="header-inner">
      <div class="header-logo">
        <a href="https://forge-laboratory.com/" class="logo-link" aria-label="FORGE LABORATORY - 首頁" target="_blank" rel="noopener noreferrer">
          <img src="../../images/forge_lab_logo.png" alt="FORGE LABORATORY" class="logo-img">
        </a>
      </div>
      <div class="header-actions">
        <a href="#" class="btn-mode" id="btn-mode-toggle" role="button" aria-label="切換到辦公室模式">
          <span class="btn-mode-frame">
            <img src="../../images/button_frame.svg" alt="" class="btn-mode-frame-img" aria-hidden="true">
            <span class="btn-mode-text" id="btn-mode-text">辦公室模式</span>
          </span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-wrap login-wrap">
    <main class="login-content">
      <h1 class="login-title-main">Key Performance Navigator</h1>
      <h2 class="login-title-sub">忘記密碼</h2>
      <form class="login-form" action="#" method="post" id="forgot-form">

        <div class="form-group">
          <label for="forgot-email">電子信箱 :</label>
          <input type="email" id="forgot-email" name="email" required autocomplete="email" placeholder="">
        </div>
        <p class="auth-message" id="forgot-message" role="status" aria-live="polite" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn-submit btn-login" id="btn-forgot" disabled>送出</button>
        </div>
        <p class="auth-secondary-link"><a href="../login/index.html">返回登入</a></p>

      </form>
    </main>
    <footer class="site-footer">
      <div class="footer-separator"></div>
      <div class="footer-logo">
        <a href="https://forge-laboratory.com/" class="logo-link" aria-label="FORGE LABORATORY - 首頁" target="_blank" rel="noopener noreferrer">
          <img src="../../images/forge_lab_logo.png" alt="FORGE LABORATORY" class="logo-img">
        </a>
      </div>
      <div class="footer-brand">
      <p class="footer-product">Key Performance Navigator</p>
      <p class="footer-version">Version 1.0.0</p>
      <p class="footer-copy">© 2025 Forge Laboratory</p>
    </div>
    </footer>
  </div>

  <div class="lang-select-wrap" id="lang-select-wrap" data-url-en="../en/forgot-password/index.html" data-url-ja="../../forgot-password/index.html" data-url-zh-tw="index.html">
    <button type="button" class="lang-select-btn" id="lang-select-btn" aria-expanded="false" aria-haspopup="listbox" aria-label="Language">
      <span class="lang-code" aria-hidden="true">TW</span>
      <span class="lang-name">Traditional Chinese</span>
      <span class="lang-chevron" aria-hidden="true"></span>
    </button>
    <div class="lang-select-dropdown" id="lang-select-dropdown" role="listbox" hidden>
      <button type="button" class="lang-option lang-option-ja" role="option" data-lang="ja">JP - Japanese</button>
      <button type="button" class="lang-option lang-option-en" role="option" data-lang="en">EN - English</button>
      <button type="button" class="lang-option lang-option-zh-tw lang-option-active" role="option" data-lang="zh-tw">TW - Traditional Chinese</button>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'kpi-office-mode';
      var bodyEl = document.getElementById('body-el');
      var btnModeToggle = document.getElementById('btn-mode-toggle');
      var btnModeText = document.getElementById('btn-mode-text');
      function updateModeButton() {
        if (!btnModeText || !btnModeToggle) return;
        var isOffice = bodyEl && bodyEl.classList.contains('office-mode');
        btnModeText.textContent = isOffice ? 'SCI-FI MODE' : '辦公室模式';
        btnModeToggle.setAttribute('aria-label', isOffice ? 'Sci-Fi' : '切換到辦公室模式');
      }
      if (bodyEl && btnModeToggle) {
        if (sessionStorage.getItem(STORAGE_KEY) === '1') bodyEl.classList.add('office-mode');
        btnModeToggle.addEventListener('click', function (e) {
          e.preventDefault();
          bodyEl.classList.toggle('office-mode');
          if (bodyEl.classList.contains('office-mode')) sessionStorage.setItem(STORAGE_KEY, '1');
          else sessionStorage.removeItem(STORAGE_KEY);
          updateModeButton();
        });
        updateModeButton();
      }
    })();
    (function () {
      var langBtn = document.getElementById('lang-select-btn');
      var langDropdown = document.getElementById('lang-select-dropdown');
      var langOptions = document.querySelectorAll('.lang-option');
      var langWrap = document.getElementById('lang-select-wrap');
      if (langBtn && langDropdown) {
        langBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = !langDropdown.hidden;
          langDropdown.hidden = isOpen;
          langBtn.setAttribute('aria-expanded', !isOpen);
        });
        document.addEventListener('click', function () {
          langDropdown.hidden = true;
          langBtn.setAttribute('aria-expanded', 'false');
        });
        var urlEn = langWrap && langWrap.getAttribute('data-url-en');
        var urlJa = langWrap && langWrap.getAttribute('data-url-ja');
        var urlZhTw = langWrap && langWrap.getAttribute('data-url-zh-tw');
        langOptions.forEach(function (opt) {
          opt.addEventListener('click', function (e) {
            e.stopPropagation();
            var lang = this.getAttribute('data-lang');
            var href = lang === 'ja' && urlJa ? urlJa : lang === 'en' && urlEn ? urlEn : lang === 'zh-tw' && urlZhTw ? urlZhTw : null;
            if (href) {
              try {
                var tok = new URLSearchParams(window.location.search).get('token');
                if (tok) href += (href.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(tok);
              } catch (_e) {}
              window.location.href = href;
            }
          });
        });
      }
    })();
  </script>
  <script src="../../js/kpi-auth-client.js?v=20260923-c2c"></script>
  <script src="../../js/kpi-forgot-password-page.js"></script>
</body>
</html>
