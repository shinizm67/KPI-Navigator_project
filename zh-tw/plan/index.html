  <div class="lang-select-wrap" id="lang-select-wrap" data-url-en="../../en/plan/index.html" data-url-ja="../../plan/index.html" data-url-zh-tw="index.html">

      <button type="button" class="lang-option lang-option-zh-tw lang-option-active" role="option" data-lang="zh-tw">TW - Traditional Chinese</button>
    </div>

  <script>
  (function(){
    var STORAGE_KEY = 'kpi-office-mode';
    var bodyEl = document.getElementById('body-el');
    var btnModeToggle = document.getElementById('btn-mode-toggle');
    var btnModeText = document.getElementById('btn-mode-text');
    function updateModeButton() {
      if (!btnModeText || !btnModeToggle) return;
      var isOffice = bodyEl && bodyEl.classList.contains('office-mode');
      btnModeText.textContent = isOffice ? 'SCI-FI MODE' : 'OFFICE MODE';
      btnModeToggle.setAttribute('aria-label', isOffice ? '切換至 Sci-Fi Mode' : '切換至 Office Mode');
    }
    if (bodyEl && btnModeToggle) {
      if (sessionStorage.getItem(STORAGE_KEY) === '1') {
        bodyEl.classList.add('office-mode');
      }
      btnModeToggle.addEventListener('click', function (e) {
        e.preventDefault();
        bodyEl.classList.toggle('office-mode');
        if (bodyEl.classList.contains('office-mode')) {
          sessionStorage.setItem(STORAGE_KEY, '1');
        } else {
          sessionStorage.removeItem(STORAGE_KEY);
        }
        updateModeButton();
      });
      updateModeButton();
    }
    var langWrap = document.getElementById('lang-select-wrap');
    var langBtn = langWrap && langWrap.querySelector('.lang-select-btn');
    if (langBtn && langWrap) {
      var dropdown = document.getElementById('lang-select-dropdown');
      if (dropdown) {
        langBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          dropdown.hidden = !dropdown.hidden;
          langBtn.setAttribute('aria-expanded', !dropdown.hidden);
        });
        document.addEventListener('click', function () {
          dropdown.hidden = true;
          langBtn.setAttribute('aria-expanded', 'false');
        });
      }
      var urlEn = langWrap && langWrap.getAttribute('data-url-en');
        var urlJa = langWrap && langWrap.getAttribute('data-url-ja');
        var urlZhTw = langWrap && langWrap.getAttribute('data-url-zh-tw');
      langWrap.querySelectorAll('.lang-option').forEach(function (opt) {
        opt.addEventListener('click', function (e) {
          e.stopPropagation();
          if (bodyEl && bodyEl.classList.contains('office-mode')) {
            sessionStorage.setItem(STORAGE_KEY, '1');
          }
          var lang = this.getAttribute('data-lang');
          var href =
              lang === 'ja' && urlJa
                ? urlJa
                : lang === 'en' && urlEn
                  ? urlEn
                  : lang === 'zh-tw' && urlZhTw
                    ? urlZhTw
                    : null;
          if (href) window.location.href = href;
        });
      });
    }
  })();
  </script>
